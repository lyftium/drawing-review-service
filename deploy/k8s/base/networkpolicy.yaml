# Only the gateway namespace may call the API; the API may only call vLLM and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drawing-review
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: drawing-review
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ai-gateway }
        - podSelector: {}  # same namespace (eval Job, port-forward debugging)
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: vllm-llava }
      ports:
        - { port: 8000, protocol: TCP }
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
