apiVersion: apps/v1
kind: Deployment
metadata:
  name: drawing-review
  labels: &labels
    app.kubernetes.io/name: drawing-review
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5  # keeps old ReplicaSets so `kubectl rollout undo` works
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: drawing-review
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/lyftium/drawing-review-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: drawing-review-config }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          # Startup: model loading can be slow; give it up to 5 minutes before liveness applies.
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 30
          # Readiness: only route traffic when every backend (incl. remote vLLM) answers.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: restart only if the process itself is stuck. It does not depend on
          # vLLM, so an inference outage does not cause a restart storm here.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: weights, mountPath: /models, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: weights
          persistentVolumeClaim: { claimName: model-weights, readOnly: true }
