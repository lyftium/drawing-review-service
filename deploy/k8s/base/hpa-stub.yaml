# STUB ONLY — not applied, not timed. Documents the shape of an HPA for interviews.
# CPU utilisation is the wrong signal for GPU vLLM; replace with KEDA/queue metrics in real life.
# See docs/autoscaling.md.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: drawing-review-hpa-stub
  namespace: drawing-review
  labels:
    app.kubernetes.io/part-of: drawing-review
    lyftium.dev/status: stub-unmeasured
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: drawing-review
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
