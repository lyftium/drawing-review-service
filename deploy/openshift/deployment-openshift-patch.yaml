# Restricted SCC / restricted-v2: OpenShift assigns an arbitrary UID from the
# namespace range. The fixed runAsUser/runAsGroup/fsGroup are removed by the
# JSON patches in kustomization.yaml (a strategic merge cannot delete fields).
# Keep runAsNonRoot, drop ALL caps, read-only root, RuntimeDefault seccomp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drawing-review
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
