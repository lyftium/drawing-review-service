# Prometheus alerting rules (plain rule file; wrap in a PrometheusRule if you use the operator).
groups:
  - name: drawing-review
    rules:
      - record: drw:request_latency_seconds:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(drw_request_duration_seconds_bucket{route="/v1/analyze"}[5m])))
      - record: drw:error_ratio:5m
        expr: |
          sum(rate(drw_request_duration_seconds_count{route="/v1/analyze",status=~"5.."}[5m]))
          / clamp_min(sum(rate(drw_request_duration_seconds_count{route="/v1/analyze"}[5m])), 1e-9)
      - record: drw:llm_ttft_seconds:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(drw_llm_time_to_first_token_seconds_bucket[5m])))
      - alert: DrawingReviewHighLatency
        expr: drw:request_latency_seconds:p95 > 10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: p95 analyze latency above 10 s for 10 minutes
      - alert: DrawingReviewErrors
        expr: drw:error_ratio:5m > 0.02
        for: 5m
        labels: { severity: page }
        annotations:
          summary: more than 2% of analyze requests fail with 5xx
      - alert: DrawingReviewInterpreterFallbacks
        expr: rate(drw_interpreter_fallbacks_total[15m]) > 0.1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: the VLM answers are failing schema validation; check the model version
      - alert: DrawingReviewNotReady
        expr: max(drw_backend_ready) == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: no replica reports ready backends
