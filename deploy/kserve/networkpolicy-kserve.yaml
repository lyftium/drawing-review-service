# The base policy only lets the API reach the standalone vllm-llava pods. With
# KServe the model runs in the InferenceService predictor pods on port 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drawing-review-to-kserve
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: drawing-review
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: { serving.kserve.io/inferenceservice: llava }
      ports:
        - { port: 8080, protocol: TCP }
---
# Only the API (and Prometheus, via the OpenShift monitoring policy group) may call
# the model server; nothing else in the cluster gets a direct GPU endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llava-predictor
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: llava
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: drawing-review }
        - namespaceSelector:
            matchLabels: { network.openshift.io/policy-group: monitoring }
      ports:
        - { port: 8080, protocol: TCP }
