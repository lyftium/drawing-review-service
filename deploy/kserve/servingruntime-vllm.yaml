# vLLM as a KServe ServingRuntime: the image and server flags live here once, and
# every InferenceService that declares modelFormat vLLM reuses them. The labels and
# annotations make it selectable in the OpenShift AI dashboard (single-model serving).
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-openai
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: vLLM (OpenAI-compatible API)
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
spec:
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics  # TTFT, queue time, KV-cache usage
  containers:
    - name: kserve-container
      image: vllm/vllm-openai:v0.6.4
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
        - --disable-log-requests  # prompts would contain document text
      env:
        - { name: HOME, value: /tmp }
        - { name: XDG_CACHE_HOME, value: /tmp/.cache }
        - { name: HF_HUB_OFFLINE, value: "1" }  # weights come from storageUri, never the Hub
      ports:
        - { containerPort: 8080, protocol: TCP }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      volumeMounts:
        - { name: shm, mountPath: /dev/shm }  # NCCL needs shared memory for tensor parallelism
        - { name: tmp, mountPath: /tmp }
  volumes:
    - name: shm
      emptyDir: { medium: Memory, sizeLimit: 8Gi }
    - name: tmp
      emptyDir: { sizeLimit: 4Gi }
