[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing-review"
version = "0.1.0"
description = "Reference implementation: turning a technical-drawing analysis prototype into a deployable, measurable service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lyftium" }]
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20",
  "pillow>=11,<12",
  "numpy>=2.1,<3",
  "prometheus-client>=0.21,<0.22",
  "httpx>=0.28,<0.29",
  "pyyaml>=6,<7",
  "pypdfium2>=4.30,<5",
]

[project.optional-dependencies]
# Real model backends. Not installed in CI; the stub backends cover the tests.
yolo = ["ultralytics>=8.3"]
ocr = ["pytesseract>=0.3.13"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
drawing-review = "drawing_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drawing_review = ["evaluation/gates.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"bench/*" = ["S311"]
"src/drawing_review/synth/*" = ["S311"]
