name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: |
          pip install -r requirements.lock -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit, integration and golden regression tests
        run: pytest
      - name: Evaluation gates on the reference set
        run: |
          mkdir -p reports
          drawing-review eval --data golden --report reports/eval.md --runs-dir reports/runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform + kustomize
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/
      - name: Validate rendered manifests
        run: |
          kustomize build deploy/k8s/overlays/kind | kubeconform -strict -summary -
          kustomize build deploy/k8s/overlays/gpu | kubeconform -strict -summary -
          kubeconform -strict -summary deploy/k8s/vllm/
          kustomize build deploy/openshift | kubeconform -strict -ignore-missing-schemas -summary -
          kustomize build deploy/openshift-ai | kubeconform -strict -ignore-missing-schemas -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -summary -

  image:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (load for smoke; no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: drawing-review:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
      - name: Smoke test the image
        run: |
          docker run -d --name drw -p 8080:8080 --read-only --tmpfs /tmp drawing-review:${{ github.sha }}
          for i in $(seq 1 30); do curl -fsS localhost:8080/readyz && break; sleep 1; done
          curl -fsS -F file=@golden/images/syn-001.png localhost:8080/v1/analyze | python -m json.tool | head -20
          docker run --rm drawing-review:${{ github.sha }} id -u | grep -qx 10001

  ghcr:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint-test, image]
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lyftium/drawing-review-service:dev
            ghcr.io/lyftium/drawing-review-service:0.1.0
            ghcr.io/lyftium/drawing-review-service:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: false
      - name: Record digest artifact
        run: |
          mkdir -p digests
          DIGEST='${{ steps.push.outputs.digest }}'
          echo "image=ghcr.io/lyftium/drawing-review-service" > digests/drawing-review-service.txt
          echo "tag=dev,0.1.0,sha-${{ github.sha }}" >> digests/drawing-review-service.txt
          echo "digest=${DIGEST}" >> digests/drawing-review-service.txt
          echo "git=${{ github.sha }}" >> digests/drawing-review-service.txt
          echo "recorded_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> digests/drawing-review-service.txt
          cat digests/drawing-review-service.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ghcr-digest-drawing-review-service
          path: digests/drawing-review-service.txt
